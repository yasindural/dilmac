name: Room quality checks

on:
  push:
    branches:
      - agent/room-*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  room-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build
      - name: Real translation smoke (no mocks)
        env:
          TERRASPEAK_API_URL: https://dilmac-api-bridge.vercel.app/api
          TERRASPEAK_MAX_TRANSLATION_MS: "12000"
        run: node e2e/real-translation-smoke.mjs
